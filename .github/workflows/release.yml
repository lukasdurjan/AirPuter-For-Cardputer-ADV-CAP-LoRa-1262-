name: Build and publish firmware

on:
  push:
    branches:
      - main
    paths-ignore:
      - "release/AirPuter.bin"
      - "include/generated_version.h"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airputer-release-main
  cancel-in-progress: false

jobs:
  release:
    # Espressif's pinned compiler packages are validated on 24.04. Avoid the
    # ubuntu-latest migration to Ubuntu 26 breaking otherwise unchanged builds.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Select next patch version
        id: version
        shell: bash
        run: |
          git fetch --force --tags
          version="$(python tools/next_release_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat > include/generated_version.h <<EOF
          #pragma once

          // Updated automatically by the release workflow. Keep the v-prefix so this
          // value matches the Git tag and the name shown in GitHub Releases.
          #define AIRPUTER_VERSION "$version"
          EOF

      - name: Build complete flash image
        shell: bash
        run: |
          set -o pipefail
          pio run -e m5stack-cardputer 2>&1 | tee platformio-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 platformio-build.log > platformio-build-tail.log
            {
              echo "::group::PlatformIO failure tail"
              cat platformio-build-tail.log
              echo "::endgroup::"
              echo "::error::PlatformIO build failed; see the failure tail above"
            }
            exit "$status"
          fi

      - name: Commit generated version and binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          test -s release/AirPuter.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/generated_version.h release/AirPuter.bin
          git commit -m "Release $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish as latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$VERSION" release/AirPuter.bin
          --title "AirPuter $VERSION"
          --generate-notes
          --latest

